name: Build and Release GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'gui/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gui/requirements.txt
          pip install --upgrade pyinstaller

      - name: Build executable with PyInstaller
        working-directory: ./gui
        run: |
          pyinstaller --noconfirm --distpath dist --workpath build DStat-GUI-dev2.spec

      - name: Package executable into ZIP
        shell: pwsh
        run: |
          $TAG = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "build-${{ github.sha }}".Substring(0, 13) }
          $ZIP_NAME = "DStat-GUI-$TAG-Windows-x64.zip"
          Compress-Archive -Path "gui/dist/DStat-GUI-dev2" -DestinationPath $ZIP_NAME
          "ZIP_NAME=$ZIP_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
