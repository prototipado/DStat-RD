name: Build and Release GUI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión para el Release (ej. v2.1.0)'
        required: false
        default: 'v2.1.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'gui/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gui/requirements.txt
          pip install --upgrade pyinstaller

      - name: Build executable with PyInstaller
        working-directory: ./gui
        run: |
          pyinstaller --noconfirm --distpath dist --workpath build DStat-GUI-dev2.spec

      - name: Package executable into ZIP
        shell: pwsh
        run: |
          $inputTag = "${{ inputs.tag_name }}"
          $refTag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "" }
          $TAG = if ($refTag) { $refTag } elseif ($inputTag) { $inputTag } else { "v2.1.0" }
          $ZIP_NAME = "DStat-GUI-$TAG-Windows-x64.zip"
          Compress-Archive -Path "gui/dist/DStat-GUI-dev2" -DestinationPath $ZIP_NAME
          "TAG=$TAG" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ZIP_NAME=$ZIP_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: DStat GUI ${{ env.TAG }} - Windows Standalone
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
